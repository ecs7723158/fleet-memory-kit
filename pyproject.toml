[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-memory-kit"
version = "0.1.0"
description = "Local markdown memory + eval hooks for Oscar fleet (mem0/langfuse/promptfoo-aligned)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Oscar Kate", email = "ecs7723158@gmail.com" }]
dependencies = []
optional-dependencies = { dev = ["pytest>=8.0"] }

[project.scripts]
fleet-memory = "fleet_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
